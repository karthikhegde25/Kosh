name: Release APK (signed)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # only used to attach the APK to a GitHub Release for tag builds

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Check signing secrets are set
        env:
          KEYSTORE_BASE64: ${{ secrets.KOSH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the KOSH_KEYSTORE_BASE64, KOSH_KEYSTORE_PASSWORD, KOSH_KEY_ALIAS and KOSH_KEY_PASSWORD repository secrets (see RELEASE.md)."
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KOSH_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kosh-release.jks"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build signed, shrunk release APK
        env:
          KOSH_KEYSTORE_FILE: ${{ runner.temp }}/kosh-release.jks
          KOSH_KEYSTORE_PASSWORD: ${{ secrets.KOSH_KEYSTORE_PASSWORD }}
          KOSH_KEY_ALIAS: ${{ secrets.KOSH_KEY_ALIAS }}
          KOSH_KEY_PASSWORD: ${{ secrets.KOSH_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Verify signature and report size
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ls -l "$APK"
          echo "### Release APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Size: $(du -h "$APK" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: kosh-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
